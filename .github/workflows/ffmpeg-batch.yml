name: FFmpeg Batch Conversion

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Set up rclone config
        run: |
          mkdir -p $HOME/.config/rclone
          echo "$RCLONE_CONFIG" > $HOME/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Configure git remote to use PAT for pushes
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.REPO_PAT }}@github.com/${{ github.repository }}.git

      - name: Run batch conversion
        run: |
          chmod +x scripts/process.sh
          ./scripts/process.sh
