name: FFmpeg Batch Conversion

on:
  workflow_dispatch:

concurrency:
  group: ffmpeg-batch-convert
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Set up rclone config
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG" > "$HOME/.config/rclone/rclone.conf"
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Run batch conversion
        run: |
          chmod +x scripts/process.sh
          ./scripts/process.sh
